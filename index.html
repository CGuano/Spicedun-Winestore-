<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17262B">
<title>The Spicedun Wine Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Karla:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17262B; --paper:#E8DFC9; --paperDim:#9A927D;
    --bramble:#5E1F2E; --gorse:#E0A32E;
    --lichen:#93A582; --rust:#B5674F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:'Karla',system-ui,sans-serif;
    padding:18px 14px calc(70px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  h1{font-family:'Bevan',serif;font-size:32px;line-height:.95;margin:6px 0 8px;font-weight:400}
  .eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--paperDim);margin:0}
  .mast{border-bottom:2px solid var(--gorse);padding-bottom:12px;margin-bottom:16px}
  .mast p.sub{font-size:13px;color:var(--paperDim);margin:0;max-width:420px}
  .row{display:flex}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
  .center{align-items:center}.baseline{align-items:flex-end}
  button{font-family:inherit;cursor:pointer;border-radius:2px}
  .chip{padding:7px 12px;font-size:13px;font-weight:600;border:1px solid rgba(232,223,201,.3);
    background:transparent;color:var(--paper)}
  .chip.on{background:var(--gorse);color:var(--ink);border-color:var(--gorse)}
  input{background:transparent;border:1px solid rgba(232,223,201,.3);color:var(--paper);
    padding:9px 10px;border-radius:2px;font-size:16px;outline:none;font-family:inherit;width:100%}
  input::placeholder{color:var(--paperDim)}
  .tab{flex:1;padding:11px 4px;border:1px solid rgba(232,223,201,.25);background:transparent;
    color:var(--paper);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .tab.on{background:var(--gorse);color:var(--ink);border-color:var(--gorse)}
  .card{background:var(--paper);color:var(--ink);border-radius:3px;padding:14px;margin-bottom:10px}
  .card .meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:#6E6350}
  .card .nm{font-weight:800;font-size:16px;line-height:1.15;margin:0}
  .price{font-family:'Bevan',serif;font-size:26px;line-height:1;color:var(--bramble);margin:0}
  .take{width:100%;margin-top:12px;padding:12px 0;border:none;background:var(--ink);
    color:var(--paper);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
  .take[disabled]{background:#B9AE94;cursor:default}
  .h2{font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
  .slate{border-bottom:1px solid rgba(232,223,201,.15);padding:12px 0}
  .slate button.head{width:100%;background:transparent;border:none;color:var(--paper);
    padding:0;text-align:left;display:flex;justify-content:space-between;align-items:center}
  .tab-money{font-family:'Space Mono',monospace;font-size:17px;color:var(--gorse);margin:0}
  .undo{background:transparent;border:1px solid var(--rust);color:var(--rust);
    font-size:10px;padding:3px 8px}
  .bar{height:9px;background:rgba(232,223,201,.12);border-radius:1px;overflow:hidden}
  .bar>div{height:100%;transition:width .3s}
  .flash{position:fixed;left:14px;right:14px;bottom:18px;background:var(--bramble);
    color:var(--paper);padding:12px 14px;border-radius:2px;font-size:13px;font-weight:600;
    text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:530px;margin:0 auto}
  .err{color:var(--rust);font-size:13px;margin:0 0 10px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gorse);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="mast">
  <p class="eyebrow" id="mastline">Loch Lomond · six days · 90 bottles</p>
  <h1>THE SPICEDUN<br>WINE STORE</h1>
  <p class="sub">Take a bottle, tap it in. Settle up at the end.</p>
</div>

<div style="margin-bottom:16px">
  <p class="eyebrow" style="margin-bottom:8px">Who's buying</p>
  <div class="row wrap" id="people" style="gap:6px"></div>
  <div class="row" style="gap:6px;margin-top:8px">
    <input id="newName" placeholder="Add your name" maxlength="24" autocomplete="off">
    <button id="addBtn" style="padding:9px 14px;background:transparent;border:1px solid var(--lichen);
      color:var(--lichen);font-weight:700;font-size:12px;white-space:nowrap">Add</button>
  </div>
</div>

<div class="row" style="gap:6px;margin-bottom:16px">
  <button class="tab on" data-tab="shop">Shop</button>
  <button class="tab" data-tab="ledger">Ledger</button>
  <button class="tab" data-tab="cellar">Cellar</button>
</div>

<p class="err" id="err" hidden></p>
<div id="view"></div>
<p class="eyebrow" id="status" style="margin-top:26px;text-align:center">loading…</p>
<div class="flash" id="flash" hidden></div>

<script>
/* ---------------- config ---------------- */
const API = "https://api.spicedunwines.party";

const WINES = [
  { id:"pg", name:"Canaletto Pinot Grigio",    type:"White", price:6.00, stock:18, swatch:"#D9C87A" },
  { id:"br", name:"Brancott Sauvignon Blanc",  type:"White", price:7.00, stock:12, swatch:"#C6D08A" },
  { id:"vf", name:"La Vieille Ferme Rosé",     type:"Rosé",  price:7.00, stock:12, swatch:"#E0A090" },
  { id:"cm", name:"Cloud Mountain Sauv Blanc", type:"White", price:6.50, stock:12, swatch:"#AFC9B4" },
  { id:"mg", name:"McGuigan Black Label Rosé", type:"Rosé",  price:5.00, stock:36, swatch:"#D08A86" },
];

const TOTAL_BOTTLES = WINES.reduce((s,w)=>s+w.stock,0);
const wine = id => WINES.find(w=>w.id===id);
const money = n => "£"+n.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- state ---------------- */
let state = { people: [], log: [] };
let me = localStorage.getItem("spicedun:me") || null;
let tab = "shop";
let openPerson = null;

const remaining = id => wine(id).stock - state.log.filter(e=>e.wine===id).length;
const countFor  = n  => state.log.filter(e=>e.name===n).length;
const tabFor    = n  => state.log.filter(e=>e.name===n).reduce((s,e)=>s+e.price,0);
const totalTaken= () => state.log.reduce((s,e)=>s+e.price,0);

/* ---------------- api ---------------- */
async function call(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers||{}) },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function showError(msg) {
  const el = document.getElementById("err");
  if (!msg) { el.hidden = true; return; }
  el.textContent = msg;
  el.hidden = false;
}

async function refresh(quiet) {
  try {
    state = await call("/api/state");
    showError(null);
    render();
    document.getElementById("status").textContent = "shared with everyone on the trip";
  } catch (e) {
    if (!quiet) showError("Can't reach the store. Check signal, then pull to refresh.");
    document.getElementById("status").textContent = "offline";
  }
}

/* ---------------- actions ---------------- */
async function addPerson() {
  const input = document.getElementById("newName");
  const name = input.value.trim();
  if (!name) return;
  try {
    state = await call("/api/person", { method:"POST", body: JSON.stringify({ name }) });
    setMe(name);
    input.value = "";
    showError(null);
    render();
  } catch (e) { showError(e.message); }
}

function setMe(name) {
  me = name;
  localStorage.setItem("spicedun:me", name);
  render();
}

async function takeBottle(id) {
  const w = wine(id);
  if (!me) return flash("Pick your name first");
  if (remaining(id) <= 0) return;

  // optimistic, so the tap feels instant
  const temp = { id:"temp"+Date.now(), name:me, wine:id, price:w.price, ts:Date.now() };
  state.log.push(temp);
  render();
  flash(w.name + " — " + money(w.price) + " on " + me);

  try {
    state = await call("/api/entry", {
      method:"POST", body: JSON.stringify({ name: me, wine: id, price: w.price })
    });
    render();
  } catch (e) {
    state.log = state.log.filter(x => x.id !== temp.id);
    showError("That didn't save. Tap it again.");
    render();
  }
}

async function undoEntry(id) {
  try {
    state = await call("/api/entry?id=" + encodeURIComponent(id), { method:"DELETE" });
    render();
  } catch (e) { showError(e.message); }
}

let flashTimer;
function flash(msg) {
  const el = document.getElementById("flash");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

/* ---------------- tally ---------------- */
function tallySVG(n) {
  if (n === 0) return '<span style="color:var(--paperDim);font-family:\'Space Mono\',monospace;font-size:12px">none yet</span>';
  const groups = [];
  let left = n;
  while (left > 0) { groups.push(Math.min(5, left)); left -= 5; }
  return '<div class="row wrap baseline" style="gap:10px">' + groups.map(g => {
    const w = g === 5 ? 34 : g * 7;
    let s = `<svg width="${w}" height="26" style="overflow:visible">`;
    for (let i = 0; i < Math.min(g,4); i++) {
      s += `<line x1="${i*7+2}" y1="2" x2="${i*7+4}" y2="24" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/>`;
    }
    if (g === 5) s += `<line x1="0" y1="20" x2="32" y2="5" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/>`;
    return s + "</svg>";
  }).join("") + "</div>";
}

/* ---------------- day chart ---------------- */
function dayChart() {
  const byDay = {};
  state.log.forEach(e => {
    const k = new Date(e.ts).toISOString().slice(0,10);
    byDay[k] = (byDay[k]||0) + 1;
  });
  const days = Object.keys(byDay).sort();
  if (!days.length) return '<p style="color:var(--paperDim);font-size:14px">Nothing logged yet. The chart fills in as bottles go.</p>';
  const max = Math.max(...days.map(d=>byDay[d]));
  const W = 320, H = 120, pad = 6;
  const slot = (W - pad*2) / days.length;
  const bw = Math.min(46, slot - 8);
  let s = `<svg viewBox="0 0 ${W} ${H+26}" width="100%" style="display:block">`;
  days.forEach((d,i) => {
    const x = pad + i*slot + 4;
    const h = (byDay[d]/max) * H;
    const lbl = new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short"});
    s += `<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" fill="var(--gorse)" rx="1"/>`;
    s += `<text x="${x+bw/2}" y="${H-h-5}" text-anchor="middle" fill="var(--paper)" font-size="11" font-family="'Space Mono',monospace">${byDay[d]}</text>`;
    s += `<text x="${x+bw/2}" y="${H+16}" text-anchor="middle" fill="var(--paperDim)" font-size="10" font-family="'Space Mono',monospace">${lbl}</text>`;
  });
  s += `<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--paperDim)" stroke-width="1" opacity=".4"/></svg>`;
  return s;
}

/* ---------------- views ---------------- */
function shopView() {
  return WINES.map(w => {
    const rem = remaining(w.id), out = rem <= 0;
    return `
    <div class="card" style="opacity:${out ? 0.45 : 1}">
      <div class="row between" style="gap:12px;align-items:flex-start">
        <div style="flex:1">
          <div class="row center" style="gap:7px;margin-bottom:3px">
            <span style="width:10px;height:10px;border-radius:10px;background:${w.swatch};display:inline-block"></span>
            <span class="meta">${w.type}</span>
          </div>
          <p class="nm">${esc(w.name)}</p>
          <p class="meta" style="margin:4px 0 0;letter-spacing:0;text-transform:none">
            ${out ? "all gone" : rem + " of " + w.stock + " left"}</p>
        </div>
        <p class="price">£${w.price.toFixed(2).replace(".00","")}</p>
      </div>
      <button class="take" data-take="${w.id}" ${out?"disabled":""}>${out?"Sold out":"Take one"}</button>
    </div>`;
  }).join("");
}

function ledgerView() {
  const ranked = [...state.people].sort((a,b)=>countFor(b)-countFor(a));
  let s = `<div style="margin-bottom:20px"><p class="h2">Bottles per day</p>${dayChart()}</div>`;
  s += `<p class="h2">The slate</p>`;
  if (!ranked.length) s += `<p style="color:var(--paperDim);font-size:14px">Add a name to get going.</p>`;

  ranked.forEach(p => {
    const open = openPerson === p;
    const n = countFor(p);
    s += `<div class="slate">
      <button class="head" data-person="${esc(p)}">
        <div style="flex:1">
          <p style="font-weight:800;font-size:15px;margin:0 0 6px">${esc(p)}</p>
          ${tallySVG(n)}
        </div>
        <div style="text-align:right">
          <p class="tab-money">${money(tabFor(p))}</p>
          <p style="font-size:11px;color:var(--paperDim);margin:0">${n} bottle${n===1?"":"s"}</p>
        </div>
      </button>`;
    if (open) {
      const entries = state.log.filter(e=>e.name===p).slice().reverse();
      s += `<div style="margin-top:10px">`;
      if (!entries.length) s += `<p style="font-size:13px;color:var(--paperDim)">No bottles logged.</p>`;
      entries.forEach(e => {
        s += `<div class="row between center" style="font-size:13px;padding:6px 0;color:var(--paperDim)">
          <span>${esc(wine(e.wine).name)}</span>
          <span class="row center" style="gap:10px">
            <span style="font-family:'Space Mono',monospace">${money(e.price)}</span>
            <button class="undo" data-undo="${e.id}">undo</button>
          </span></div>`;
      });
      s += `</div>`;
    }
    s += `</div>`;
  });

  s += `<div style="margin-top:20px;padding:14px 0;border-top:2px solid var(--gorse)">
    <div class="row between" style="align-items:baseline">
      <span class="eyebrow">Total taken</span>
      <span style="font-family:'Bevan',serif;font-size:28px;color:var(--gorse)">${money(totalTaken())}</span>
    </div></div>`;
  return s;
}

function cellarView() {
  let s = `<p class="h2">What's left</p>`;
  WINES.forEach(w => {
    const rem = remaining(w.id);
    s += `<div style="margin-bottom:14px">
      <div class="row between" style="align-items:baseline;margin-bottom:5px">
        <span style="font-size:13px;font-weight:600">${esc(w.name)}</span>
        <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--paperDim)">${rem}/${w.stock}</span>
      </div>
      <div class="bar"><div style="width:${(rem/w.stock)*100}%;background:${w.swatch}"></div></div>
    </div>`;
  });
  s += `<div style="margin-top:22px;padding-top:14px;border-top:1px solid rgba(232,223,201,.15)">
    <div class="row between" style="align-items:baseline">
      <span class="eyebrow">Bottles gone</span>
      <span style="font-family:'Space Mono',monospace;font-size:15px;color:var(--paperDim)">
        ${state.log.length} of ${TOTAL_BOTTLES}</span>
    </div></div>`;
  return s;
}

/* ---------------- render ---------------- */
function render() {
  document.getElementById("mastline").textContent =
    `Loch Lomond · six days · ${TOTAL_BOTTLES} bottles`;

  document.getElementById("people").innerHTML = state.people.map(p =>
    `<button class="chip${me===p?" on":""}" data-me="${esc(p)}">${esc(p)}</button>`
  ).join("");

  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));

  document.getElementById("view").innerHTML =
    tab === "shop" ? shopView() : tab === "ledger" ? ledgerView() : cellarView();
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-take],[data-me],[data-person],[data-undo],.tab");
  if (!t) return;
  if (t.dataset.take)   return takeBottle(t.dataset.take);
  if (t.dataset.me)     return setMe(t.dataset.me);
  if (t.dataset.undo)   return undoEntry(t.dataset.undo);
  if (t.dataset.person) { openPerson = openPerson === t.dataset.person ? null : t.dataset.person; return render(); }
  if (t.classList.contains("tab")) { tab = t.dataset.tab; openPerson = null; return render(); }
});

document.getElementById("addBtn").addEventListener("click", addPerson);
document.getElementById("newName").addEventListener("keydown", e => {
  if (e.key === "Enter") addPerson();
});

render();
refresh();
setInterval(() => refresh(true), 15000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh(true);
});
</script>
</body>
</html>
